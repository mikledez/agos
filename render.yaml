# Free staging deployment: no persistent disk, so uploaded JPEGs are lost on
# redeploy/restart (metadata still lives in Neon). For persistent uploads,
# switch to plan: starter, add the disk block below and set
# AGOS_UPLOAD_DIR=/var/data/uploads.
services:
  - type: web
    name: agos-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python scripts/download_models.py
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: DATABASE_URL
        sync: false
      - key: AGOS_INTERNAL_SECRET
        sync: false
      - key: AGOS_ALLOW_DEV_USER
        value: "0"
      - key: AGOS_MAX_UPLOAD_BYTES
        value: "10485760"
      - key: AGOS_UPLOAD_DIR
        value: /tmp/agos-uploads
      - key: AGOS_HUMANIZATION_PROVIDER
        value: groq
      - key: AGOS_GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: AGOS_GROQ_FALLBACK_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_API_KEY
        sync: false
    # disk:
    #   name: agos-uploads
    #   mountPath: /var/data
    #   sizeGB: 1
