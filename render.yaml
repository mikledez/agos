services:
  - type: web
    name: agos-api
    runtime: python
    plan: starter
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python scripts/download_models.py
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: DATABASE_URL
        sync: false
      - key: AGOS_INTERNAL_SECRET
        sync: false
      - key: AGOS_ALLOW_DEV_USER
        value: "0"
      - key: AGOS_MAX_UPLOAD_BYTES
        value: "10485760"
      - key: AGOS_UPLOAD_DIR
        value: /var/data/uploads
    disk:
      name: agos-uploads
      mountPath: /var/data
      sizeGB: 1
